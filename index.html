<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#234638">
<title>Zuchtbuch – Prototyp</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--green:#234638;--green2:#315c49;--bg:#f3f5f2;--card:#fff;--ink:#202720;--muted:#69736b;--line:#dce3dc;--accent:#e8efe9;--danger:#a13c35;--shadow:0 3px 16px #18251c0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.sidebar{background:var(--green);color:white;padding:24px 16px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:10px;padding:0 8px}.brandmark{background:#d8e7da;color:var(--green);width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:24px}.brand h1{font-size:18px;margin:0}.brand small{display:block;color:#d2dfd5;font-size:12px}.tenant-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#d2dfd5;margin:8px 8px 0}.sidebar select{width:100%;padding:10px;border-radius:9px;border:1px solid #688273;background:#fff;color:#20382c}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#e4ece6;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:10px;align-items:center}.nav button.active,.nav button:hover{background:#ffffff20;color:#fff}.sidefoot{margin-top:auto;color:#d2dfd5;font-size:12px;padding:8px}.main{min-width:0}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px}.topbar strong{font-size:17px}.topmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pill{font-size:12px;padding:5px 9px;border-radius:99px;background:#edf5ee;color:#2d6244;white-space:nowrap}.pill.offline{background:#fff3d9;color:#815b15}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--green);font-weight:700}.content{padding:28px;max-width:1450px;margin:auto}.welcome{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--green2);font-weight:700}.welcome h2{font-size:29px;line-height:1.15;margin:6px 0}.welcome p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:white;color:var(--ink);font-weight:600}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--danger)}.btn.small{padding:6px 10px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}.stat,.panel,.formcard{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:17px}.stat .label{color:var(--muted);font-size:13px}.stat .num{font-size:30px;font-weight:750;margin:5px 0}.stat .sub{font-size:12px;color:var(--muted)}.panel{padding:20px;margin-bottom:18px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panelhead h3{margin:0;font-size:17px}.panelhead p{margin:3px 0 0;color:var(--muted);font-size:13px}.quickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.quick{border:1px solid var(--line);background:#fff;border-radius:12px;padding:15px;text-align:left;display:flex;gap:12px;align-items:center}.quick:hover{border-color:#9ab7a0;background:#fbfdfb}.quick .ico{width:40px;height:40px;border-radius:11px;background:var(--accent);display:grid;place-items:center;font-size:21px}.quick strong{display:block}.quick small{color:var(--muted)}.notice{border:1px solid #ead9ae;background:#fff8e7;padding:12px 14px;border-radius:11px;color:#6f551e;font-size:13px;margin:16px 0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}.toolbar input{flex:1;min-width:180px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:720px;background:#fff}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f7f9f7;color:#536057;font-weight:700;white-space:nowrap}tr:last-child td{border-bottom:0}.empty{text-align:center;padding:28px;color:var(--muted)}.tag{display:inline-block;padding:3px 7px;border-radius:7px;background:#edf4ee;color:#315c49;font-size:11px;font-weight:700}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#536057;font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:white;color:var(--ink)}.field textarea{min-height:78px;resize:vertical}.formactions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.recordgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.record{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff}.record h4{margin:0 0 5px}.record p{color:var(--muted);font-size:13px;margin:0 0 12px}.record .actions{margin-top:8px}.muted{color:var(--muted)}.section-intro{color:var(--muted);margin:-7px 0 17px}.hidden{display:none!important}.footer-note{font-size:12px;color:var(--muted);margin-top:18px}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{padding:12px;gap:10px}.brand{padding:0 4px}.brandmark{width:36px;height:36px}.sidebar .tenant-label,.sidefoot{display:none}.sidebar select{max-width:100%}.nav{display:flex;overflow:auto;padding-bottom:2px}.nav button{white-space:nowrap;padding:9px 10px}.topbar{height:auto;min-height:60px;padding:12px 18px}.content{padding:18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.quickgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.recordgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:540px){.welcome{display:block}.welcome .actions{margin-top:14px}.welcome h2{font-size:25px}.quickgrid,.recordgrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.topmeta .pill{display:none}.content{padding:14px}.panel{padding:15px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">🐾</div><div><h1>Zuchtbuch</h1><small>Digitales Zwingerbuch</small></div></div>
  <div><div class="tenant-label">Aktiver Zuchtbetrieb</div><select id="tenantSelect" aria-label="Zuchtbetrieb wechseln"></select></div>
  <nav class="nav" id="nav">
    <button data-page="dashboard" class="active">⌂ Übersicht</button>
    <button data-page="kennel">▤ Zwinger & Züchter</button>
    <button data-page="dogs">🐕 Hundebestand</button>
    <button data-page="litters">♧ Würfe & Welpen</button>
    <button data-page="titles">★ Titel & Championate</button>
    <button data-page="ztp">✓ ZTP</button>
    <button data-page="deworming">＋ Entwurmungen</button>
    <button data-page="vaccinations">＋ Impfplan</button>
    <button data-page="bitches">♀ Zuchthündinnen</button>
    <button data-page="studs">♂ Deckrüden</button>
    <button data-page="protocols">▣ Wurfprotokolle</button>
    <button data-page="export">⇩ Export & Sicherung</button>
  </nav>
  <div class="sidefoot">Prototyp · lokale Speicherung<br>Cloud-Synchronisierung noch nicht aktiv</div>
</aside>
<main class="main">
  <header class="topbar"><strong id="pageTitle">Übersicht</strong><div class="topmeta"><span class="pill" id="syncState">● Lokal gespeichert</span><span class="pill offline" id="netState">Offline-fähig</span><span class="avatar" id="avatar">Z</span></div></header>
  <div class="content" id="view"></div>
</main>
</div>
<div id="modalRoot"></div>
<script>
const STORE='zuchtbuch-prototype-v1';
const titles={dashboard:'Übersicht',kennel:'Zwinger & Züchterdaten',dogs:'Hundebestand',litters:'Würfe & Welpen',titles:'Titel & Championate',ztp:'Zuchttauglichkeitsprüfungen (ZTP)',deworming:'Entwurmungsplan',vaccinations:'Impfplan',bitches:'Verzeichnis der Zuchthündinnen',studs:'Verzeichnis der Deckrüden',protocols:'Wurfprotokoll Teil 1',export:'Export & Datensicherung'};
const fields={
dogs:[['name','Name des Hundes','text',true],['sex','Geschlecht','select',true,['Hündin','Rüde']],['birth','Geburtsdatum','date'],['regNo','Zuchtbuchnummer','text'],['chip','Chipnummer','text'],['color','Farbe','text'],['size','Größe','text'],['weight','Gewicht','text'],['hair','Haarart','text'],['entry','Zugangsdatum','date'],['exit','Abgangsdatum','date'],['status','Zuchtstatus','select',false,['Bestand','Zuchthündin','Deckrüde','Abgegeben','Verstorben']],['tests','Pflichtuntersuchungen','textarea'],['notes','Besondere Merkmale / Bemerkungen','textarea']],
litters:[['date','Wurfdatum','date',true],['dam','Name der Hündin','text',true],['sire','Name des Deckrüden','text',true],['sireOwner','Eigentümer des Deckrüden','text'],['sireReg','Zb.-Nr. / Chipnr. des Deckrüden','text'],['matingDate','Deckdatum','date'],['bornFemale','Lebende Hündinnen','number'],['bornMale','Lebende Rüden','number'],['deadFemale','Verendete Hündinnen','number'],['deadMale','Verendete Rüden','number'],['notes','Bemerkungen zum Wurf','textarea']],
titles:[['dog','Name des Hundes','text',true],['date','Datum','date'],['place','Ort der Ausstellung','text'],['achievement','Erfolge / Titel / Championat','text'],['rating','Wertnote','text'],['judge','Richter','text'],['notes','Bemerkungen','textarea']],
ztp:[['dog','Name des Hundes','text',true],['date','Datum der Prüfung','date'],['place','Ort der Prüfung','text'],['examiner','Richter / Zuchtwart / Arzt','text'],['passed','Bestanden','select',false,['Ja','Nein','Ausstehend']],['appearance','Gesamterscheinung','text'],['notes','Bemerkungen','textarea']],
deworming:[['dog','Name des Hundes','text',true],['product','Name der Wurmkur','text'],['date','Datum der Wurmkur','date'],['nextDate','Nächste Wurmkur','date'],['dose','Dosierung','text'],['notes','Bemerkungen','textarea']],
vaccinations:[['dog','Name des Hundes','text',true],['vet','Tierarzt','text'],['vaccine','Name des Impfstoffes','text'],['date','Datum','date'],['validUntil','Gültig bis','date'],['nextDate','Nächste Impfung','date'],['notes','Bemerkungen','textarea']],
protocols:[['dam','Hündin','text',true],['sire','Deckrüde','text'],['date','Wurfdatum','date'],['matingDate','Deckdatum','date'],['healthBefore','Gesundheitszustand vor dem Werfen','textarea'],['healthAfter','Gesundheitszustand nach dem Werfen','textarea'],['healthNursing','Nach dem Absäugen','textarea'],['litterCount','Anzahl der Würfe','number'],['gestation','Trächtigkeitsdauer','text'],['nursing','Dauer der Säugezeit','text'],['birthCourse','Verlauf der Geburt','textarea'],['weightsBirth','Gewichte bei Geburt (höchstes / niedrigstes / Durchschnitt)','text'],['weightsWeek','Gewichte nach einer Woche','text'],['weightsFour','Gewichte nach vier Wochen','text'],['weightsEight','Gewichte nach acht Wochen','text'],['dewormed','Entwurmt am','text'],['vaccinated','Geimpft am','text'],['observations','Besondere Beobachtungen','textarea'],['inspection','Wurfbesichtigung durch Zuchtwart','text'],['acceptance','Wurfabnahme durch Zuchtwart / Arzt','text']]
};
let state=loadState(),page='dashboard',editing=null;
function blankTenant(name='Meine Zucht'){return {id:uid(),name,kennel:{member:'',since:'',protectionDate:'',section11:'',vetOffice:'',breederName:'',street:'',city:'',phone:'',email:''},dogs:[],litters:[],titles:[],ztp:[],deworming:[],vaccinations:[],protocols:[]}}
function loadState(){try{let s=JSON.parse(localStorage.getItem(STORE));if(s&&s.tenants?.length)return s}catch(e){};const t=blankTenant('Meine Zucht');return {active:t.id,tenants:[t]}}
function save(){localStorage.setItem(STORE,JSON.stringify(state));document.getElementById('syncState').textContent='● Lokal gespeichert';}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function tenant(){return state.tenants.find(t=>t.id===state.active)||state.tenants[0]}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(d){if(!d)return '—';return d}
function selectTenant(){const el=document.getElementById('tenantSelect');el.innerHTML=state.tenants.map(t=>`<option value="${t.id}" ${t.id===state.active?'selected':''}>${esc(t.name)}</option>`).join('');}
function setPage(p){page=p;editing=null;render()}
function render(){selectTenant();document.getElementById('pageTitle').textContent=titles[page]||page;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('avatar').textContent=(tenant().name||'Z').trim().charAt(0).toUpperCase();const v=document.getElementById('view');if(page==='dashboard')v.innerHTML=dashboard();else if(page==='kennel')v.innerHTML=kennelPage();else if(page==='export')v.innerHTML=exportPage();else v.innerHTML=listPage(page);bindView()}
function dashboard(){const t=tenant();return `<div class="welcome"><div><div class="eyebrow">Dein digitales Zwingerbuch</div><h2>Willkommen bei ${esc(t.name)}</h2><p>Deine Zuchtdaten an einem Ort – auf Handy, Tablet und Computer.</p></div><div class="actions"><button class="btn" data-action="newTenant">＋ Zuchtbetrieb hinzufügen</button><button class="btn primary" data-action="addDog">＋ Hund anlegen</button></div></div>
<div class="notice"><strong>Prototyp-Hinweis:</strong> Daten werden in diesem Browser auf diesem Gerät gespeichert. Die Zuchtbetriebe sind in der Oberfläche getrennt, aber noch nicht durch echte Online-Benutzerkonten geschützt. Cloud-Synchronisierung ist noch nicht eingerichtet.</div>
<div class="stats"><div class="stat"><div class="label">Hunde im Bestand</div><div class="num">${t.dogs.filter(d=>!['Abgegeben','Verstorben'].includes(d.status)).length}</div><div class="sub">Seite 2 deiner Vorlage</div></div><div class="stat"><div class="label">Zuchthündinnen</div><div class="num">${t.dogs.filter(d=>d.sex==='Hündin'&&(d.status==='Zuchthündin'||d.status==='Bestand')).length}</div><div class="sub">Verzeichnis der Hündinnen</div></div><div class="stat"><div class="label">Deckrüden</div><div class="num">${t.dogs.filter(d=>d.sex==='Rüde'&&(d.status==='Deckrüde'||d.status==='Bestand')).length}</div><div class="sub">Verzeichnis der Deckrüden</div></div><div class="stat"><div class="label">Dokumentierte Würfe</div><div class="num">${t.litters.length}</div><div class="sub">Wurfzusammenfassung</div></div></div>
<div class="panel"><div class="panelhead"><div><h3>Schnellzugriff</h3><p>Häufig benötigte Bereiche deines Zuchtbuchs</p></div></div><div class="quickgrid">
<button class="quick" data-page="dogs"><span class="ico">🐕</span><span><strong>Hundebestand</strong><small>Hunde und Kennzeichnungen</small></span></button>
<button class="quick" data-page="litters"><span class="ico">🐾</span><span><strong>Wurf eintragen</strong><small>Deckdaten und Wurfstärke</small></span></button>
<button class="quick" data-page="protocols"><span class="ico">📋</span><span><strong>Wurfprotokoll</strong><small>Geburtsverlauf und Gewichte</small></span></button>
<button class="quick" data-page="vaccinations"><span class="ico">💉</span><span><strong>Impfplan</strong><small>Impfungen und Gültigkeit</small></span></button>
<button class="quick" data-page="deworming"><span class="ico">🩺</span><span><strong>Entwurmungen</strong><small>Wurmkuren dokumentieren</small></span></button>
<button class="quick" data-page="export"><span class="ico">📄</span><span><strong>Export & Sicherung</strong><small>JSON-Datensicherung / CSV</small></span></button>
</div></div>
<div class="panel"><div class="panelhead"><div><h3>Zuletzt erfasste Hunde</h3><p>Ein schneller Überblick über deine Einträge</p></div><button class="btn small" data-page="dogs">Alle Hunde anzeigen</button></div>${t.dogs.length?dogsTable(t.dogs.slice(-5).reverse()):'<div class="empty">Noch keine Hunde angelegt. Lege den ersten Hund an, um zu beginnen.</div>'}</div>`}
function dogsTable(rows){return `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Geschlecht</th><th>Geboren</th><th>Zuchtbuch-Nr.</th><th>Chipnummer</th><th>Status</th></tr></thead><tbody>${rows.map(d=>`<tr><td><strong>${esc(d.name)}</strong></td><td>${esc(d.sex||'—')}</td><td>${fmtDate(esc(d.birth))}</td><td>${esc(d.regNo||'—')}</td><td>${esc(d.chip||'—')}</td><td><span class="tag">${esc(d.status||'Bestand')}</span></td></tr>`).join('')}</tbody></table></div>`}
function kennelPage(){const k=tenant().kennel;return `<div class="welcome"><div><div class="eyebrow">Seite 1 der Vorlage</div><h2>Zwinger- und Züchterdaten</h2><p>Die allgemeinen Angaben für diesen Zuchtbetrieb.</p></div></div><form id="kennelForm" class="panel"><div class="formgrid">${[['member','Mitglied im'],['since','Seit'],['protectionDate','Zwingerschutz beantragt am'],['section11','Genehmigung nach § 11 liegt vor seit'],['vetOffice','Zuständiges Veterinäramt'],['breederName','Name'],['street','Straße, Nr.'],['city','PLZ / Ort'],['phone','Telefon'],['email','E-Mail']].map(([key,label])=>`<div class="field"><label>${label}</label><input name="${key}" value="${esc(k[key]||'')}" ${key==='email'?'type="email"':''}></div>`).join('')}</div><div class="formactions"><button class="btn primary" type="submit">Angaben speichern</button></div></form>`}
function listPage(p){const t=tenant(),arr=t[p]||[],labels={dogs:'Hundebestand',litters:'Würfe & Welpen',titles:'Titel und Championate',ztp:'Zuchttauglichkeitsprüfungen',deworming:'Entwurmungsplan',vaccinations:'Impfplan',bitches:'Verzeichnis der Zuchthündinnen',studs:'Verzeichnis der Deckrüden',protocols:'Wurfprotokolle'};let data=arr;if(p==='bitches')data=t.dogs.filter(d=>d.sex==='Hündin');if(p==='studs')data=t.dogs.filter(d=>d.sex==='Rüde');
let addable=['dogs','litters','titles','ztp','deworming','vaccinations','protocols'].includes(p);
let fieldset=fields[p]||[];
let cols=fieldset.slice(0,5);
return `<div class="welcome"><div><div class="eyebrow">Zuchtbuchbereich</div><h2>${labels[p]||titles[p]}</h2><p>${pageHelp(p)}</p></div><div class="actions">${addable?`<button class="btn primary" data-action="addRecord" data-type="${p}">＋ Eintrag hinzufügen</button>`:''}</div></div>
${p==='bitches'||p==='studs'?`<div class="notice">Diese Liste wird aus dem Hundebestand erstellt. Bearbeite die Stammdaten im Bereich „Hundebestand“.</div>`:''}
<div class="toolbar"><input id="searchBox" placeholder="Einträge durchsuchen …"><button class="btn" data-action="exportCsv" data-type="${p}">CSV exportieren</button></div>
${data.length?`<div class="tablewrap"><table><thead><tr>${(p==='bitches'||p==='studs'?[['name','Name'],['birth','Geboren'],['regNo','Zuchtbuch-Nr.'],['chip','Chipnummer'],['color','Farbe'],['status','Status']]:cols.map(f=>[f[0],f[1]])).map(c=>`<th>${c[1]}</th>`).join('')}<th>Aktionen</th></tr></thead><tbody id="dataRows">${data.map((r,i)=>rowHtml(p,r,i)).join('')}</tbody></table></div>`:`<div class="panel empty">Noch keine Einträge vorhanden.<br><span class="muted">Nutze „Eintrag hinzufügen“, um Daten zu erfassen.</span></div>`}
<div class="footer-note">Die Felder orientieren sich an deiner Zwingerbuch-Vorlage. Die App ersetzt noch keine amtliche Prüfung oder Verbandsfreigabe.</div>`}
function rowHtml(p,r,i){let f=(p==='bitches'||p==='studs')?[['name','Name'],['birth','Geboren'],['regNo','Zuchtbuch-Nr.'],['chip','Chipnummer'],['color','Farbe'],['status','Status']]:((fields[p]||[]).slice(0,5).map(x=>[x[0],x[1]]));return `<tr data-search="${esc(Object.values(r).join(' ').toLowerCase())}">${f.map(([k])=>`<td>${esc(r[k]||'—')}</td>`).join('')}<td><button class="btn small" data-action="editRecord" data-type="${p}" data-id="${r.id}">Bearbeiten</button> <button class="btn small danger" data-action="deleteRecord" data-type="${p}" data-id="${r.id}">Löschen</button></td></tr>`}
function pageHelp(p){return {dogs:'Stammdaten, Kennzeichnung und Zuchtstatus jedes Hundes.',litters:'Deckdatum, Wurfdatum, Wurfstärke und Bemerkungen zum Wurf.',titles:'Ausstellungen, Wertnoten, Erfolge und Championate.',ztp:'Prüfungsdatum, Prüfer, Ergebnis und Gesamterscheinung.',deworming:'Wurmkuren, Dosierungen und nächste Termine dokumentieren.',vaccinations:'Impfstoff, Tierarzt, Gültigkeit und nächste Impfung dokumentieren.',bitches:'Alle als Hündinnen erfassten Hunde auf einen Blick.',studs:'Alle als Rüden erfassten Hunde auf einen Blick.',protocols:'Gesundheitszustand der Mutterhündin, Geburtsverlauf, Gewichte und Beobachtungen.'}[p]||''}
function exportPage(){return `<div class="welcome"><div><div class="eyebrow">Datenhoheit</div><h2>Export & Datensicherung</h2><p>Erstelle eine Sicherung deiner Daten oder exportiere Tabellen zur Weiterverarbeitung.</p></div></div><div class="notice">Die Sicherung enthält nur den aktuell ausgewählten Zuchtbetrieb. Bewahre exportierte Dateien an einem sicheren Ort auf. Sie können personenbezogene Daten enthalten.</div><div class="recordgrid"><div class="record"><h4>📦 Vollständige Sicherung</h4><p>Alle Einträge dieses Zuchtbetriebs als JSON-Datei exportieren.</p><button class="btn primary" data-action="backup">JSON herunterladen</button></div><div class="record"><h4>📥 Sicherung wiederherstellen</h4><p>Eine zuvor exportierte JSON-Sicherung importieren.</p><input id="importFile" type="file" accept=".json,application/json" style="width:100%;margin:6px 0"><button class="btn" data-action="restore">Sicherung importieren</button></div><div class="record"><h4>👥 Zuchtbetrieb hinzufügen</h4><p>Eine getrennte lokale Datenumgebung für einen weiteren Züchter erstellen.</p><button class="btn" data-action="newTenant">Zuchtbetrieb erstellen</button></div></div><div class="panel" style="margin-top:16px"><h3>Aktiver Zuchtbetrieb</h3><p><strong>${esc(tenant().name)}</strong></p><p class="muted">Daten werden derzeit nur lokal in diesem Browser gespeichert. Für mehrere echte Benutzer mit Anmeldung, getrennten Berechtigungen und geräteübergreifender Synchronisierung ist ein Backend mit Zugriffskontrollen erforderlich.</p></div>`}
function addModal(type,id=null){const t=tenant();editing={type,id};let record=id?(t[type]||[]).find(r=>r.id===id):{};if(!record)record={};const fs=fields[type]||[];let html=`<div style="position:fixed;inset:0;background:#14251dcc;display:grid;place-items:center;padding:14px;z-index:10" id="modalBackdrop"><div class="panel" style="width:min(760px,100%);max-height:92vh;overflow:auto;margin:0"><div class="panelhead"><div><h3>${id?'Eintrag bearbeiten':'Neuen Eintrag anlegen'}</h3><p>${esc(titles[type]||type)}</p></div><button class="btn" data-action="closeModal">Schließen</button></div><form id="recordForm"><div class="formgrid">${fs.map(f=>fieldHtml(f,record[f[0]])).join('')}</div><div class="formactions"><button class="btn" type="button" data-action="closeModal">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></form></div></div>`;document.getElementById('modalRoot').innerHTML=html;document.getElementById('recordForm').addEventListener('submit',e=>{e.preventDefault();let obj={...record,id:record.id||uid()};new FormData(e.target).forEach((v,k)=>obj[k]=String(v).trim());let a=t[type]||(t[type]=[]);if(id){let ix=a.findIndex(x=>x.id===id);if(ix>=0)a[ix]=obj;else a.push(obj)}else a.push(obj);save();document.getElementById('modalRoot').innerHTML='';editing=null;render()})}
function fieldHtml(f,value){let [key,label,type,required,options]=f;let inp='';if(type==='select')inp=`<select name="${key}" ${required?'required':''}><option value="">Bitte wählen</option>${options.map(o=>`<option ${value===o?'selected':''}>${o}</option>`).join('')}</select>`;else if(type==='textarea')inp=`<textarea name="${key}" ${required?'required':''}>${esc(value||'')}</textarea>`;else inp=`<input name="${key}" type="${type}" value="${esc(value||'')}" ${required?'required':''} ${type==='number'?'min="0"':''}>`;return `<div class="field ${type==='textarea'?'full':''}"><label>${label}${required?' *':''}</label>${inp}</div>`}
function bindView(){const kf=document.getElementById('kennelForm');if(kf)kf.addEventListener('submit',e=>{e.preventDefault();const obj={};new FormData(kf).forEach((v,k)=>obj[k]=String(v).trim());tenant().kennel=obj;save();alert('Zwinger- und Züchterdaten gespeichert.');render()});const sb=document.getElementById('searchBox');if(sb)sb.addEventListener('input',()=>document.querySelectorAll('#dataRows tr').forEach(tr=>tr.style.display=tr.dataset.search.includes(sb.value.toLowerCase())?'':'none'))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page],[data-action]');if(!b)return;if(b.dataset.page){setPage(b.dataset.page);return}const a=b.dataset.action,t=b.dataset.type,id=b.dataset.id;if(a==='addDog')addModal('dogs');if(a==='addRecord')addModal(t);if(a==='editRecord')addModal(t,id);if(a==='closeModal')document.getElementById('modalRoot').innerHTML='';if(a==='deleteRecord'&&confirm('Diesen Eintrag wirklich löschen?')){tenant()[t]=tenant()[t].filter(x=>x.id!==id);save();render()}if(a==='newTenant'){const name=prompt('Name des neuen Zuchtbetriebs:');if(name&&name.trim()){const nt=blankTenant(name.trim());state.tenants.push(nt);state.active=nt.id;save();setPage('dashboard')}}if(a==='backup')backup();if(a==='restore')restore();if(a==='exportCsv')csv(t)});
document.getElementById('tenantSelect').addEventListener('change',e=>{state.active=e.target.value;save();render()});
function backup(){const data=JSON.stringify({app:'Zuchtbuch-Prototyp',version:1,tenant:tenant()},null,2);download(data,`zuchtbuch-${slug(tenant().name)}.json`,'application/json')}
function restore(){const input=document.getElementById('importFile');if(!input?.files?.[0]){alert('Bitte zuerst eine JSON-Sicherungsdatei auswählen.');return}const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);const nt=obj.tenant;if(!nt||!nt.name||!Array.isArray(nt.dogs))throw Error('Ungültige Sicherungsdatei');nt.id=uid();state.tenants.push(nt);state.active=nt.id;save();render();alert('Sicherung als separater Zuchtbetrieb importiert.')}catch(e){alert('Import fehlgeschlagen: '+e.message)}};reader.readAsText(input.files[0])}
function csv(type){let rows=tenant()[type]||[];if(type==='bitches')rows=tenant().dogs.filter(d=>d.sex==='Hündin');if(type==='studs')rows=tenant().dogs.filter(d=>d.sex==='Rüde');if(!rows.length){alert('Keine Daten für den Export vorhanden.');return}const keys=[...new Set(rows.flatMap(Object.keys))].filter(k=>k!=='id');const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const out=[keys.map(quote).join(';'),...rows.map(r=>keys.map(k=>quote(r[k])).join(';'))].join('\r\n');download('\ufeff'+out,`zuchtbuch-${type}.csv`,'text/csv;charset=utf-8')}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9äöüß]+/gi,'-').replace(/^-|-$/g,'')||'zuchtbetrieb'}
function download(content,name,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
window.addEventListener('online',()=>document.getElementById('netState').textContent='Online');window.addEventListener('offline',()=>document.getElementById('netState').textContent='Offline');document.getElementById('netState').textContent=navigator.onLine?'Online · lokal nutzbar':'Offline';
render();
</script>
</body>
</html>
